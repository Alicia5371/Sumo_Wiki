<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Sumo Wiki</title>
  </head>
  <body>
    <div class="nav">
      <a href="">Home</a>
      <a href="">Rikishi</a>
      <!-- Place holder image, till I create pixilated one -->
      <input type="text" placeholder=" Search" />
    </div>

    <header class="header">
      <h1>BASHO</h1>
      <p>TOP DIVISION</p>
    </header>

    <div class="rikishi-grid" id="rikishi-grid">
      <article class="pixel-card">
        <div class="card-image-container">
          <img
            src="images/Hoshoryu_Pixel.png"
            alt="Hoshoryu"
            class="pixel-img"
          />
        </div>
        <div class="card-info">
          <h2 class="rikishi-name">HOSHORYU</h2>
          <p class="rikishi-rank">RANK: Yokozuna</p>
          <p class="rikishi-stable">STABLE: Tatsunami</p>
          <button class="pixel-btn">VIEW STATS</button>
        </div>
      </article>
    </div>
  </body>
</html>
