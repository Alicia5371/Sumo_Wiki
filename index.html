<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Sumo Wiki</title>
  </head>
  <body>
    <div class="nav">
      <a href="">Home</a>
      <a href="">Rikishi</a>
      <a href="">About Sumo</a>
      <a href="">Techniques</a>
      <!-- Place holder image, till I create pixilated one -->
      <input type="text" placeholder=" Search" />
    </div>
    <!-- Makuuchi Division Champion Section -->
    <section class="tournament-champions">
      <h2>2026 March Grand Sumo Tournament Champions</h2>
      <div class="line"></div>
      <div class="rikishi-grid">
        <h3 class="makuuchi">Makuuchi Division Champion</h3>
        <article class="rikishi-card">
          <div class="card-image-container">
            <img
              src="images/Hoshoryu_Pixel.png"
              alt="Hoshoryu"
              class="pixel-img"
            />
          </div>
          <div class="card-info">
            <h2 class="rikishi-name">HOSHORYU</h2>
            <p class="rikishi-rank">RANK: Yokozuna East</p>
            <p class="rikishi-stable">STABLE: Tatsunami</p>
            <button class="stats-btn">VIEW STATS</button>
          </div>
        </article>
        <!-- Juryo Division Champion -->
        <h3 class="juryo">Juryo Division Champion</h3>
        <article class="rikishi-card">
          <div class="card-image-container">
            <img
              src="images/Hoshoryu_Pixel.png"
              alt="Hoshoryu"
              class="pixel-img"
            />
          </div>
          <div class="card-info">
            <h2 class="rikishi-name">HOSHORYU</h2>
            <p class="rikishi-rank">RANK: Yokozuna East</p>
            <p class="rikishi-stable">STABLE: Tatsunami</p>
            <button class="stats-btn">VIEW STATS</button>
          </div>
        </article>
      </div>
    </section>
  </body>
</html>
